name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: arsalancodehub-prog
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Apply Navy Blue Theme
        run: |
          sed -i \
            -e 's/#ebedf0/#ffffff/g' \
            -e 's/#9be9a8/#dbeafe/g' \
            -e 's/#40c463/#60a5fa/g' \
            -e 's/#30a14e/#2563eb/g' \
            -e 's/#216e39/#0a192f/g' \
            -e 's/#ffffff/#ffffff/g' \
            dist/github-contribution-grid-snake.svg

      - name: Make Snake White
        run: |
          sed -i \
            -e 's/fill="#0a192f"/fill="#ffffff"/g' \
            -e 's/fill:#0a192f/fill:#ffffff/g' \
            -e 's/fill="rgb(10,25,47)"/fill="#ffffff"/g' \
            dist/github-contribution-grid-snake.svg

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
