name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # White boxes for "no commits", then light blue -> dark navy as you push more code
      - name: Generate snake SVG from contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23F7FCFF&color_dots=%23FFFFFF,%23BFD0EC,%237C97C8,%2335558F,%230A192F&color_dot_border=%23CFDCF0

      # Turn the plain white snake into a crystal one (glassy gradient + blue edge)
      - name: Make the snake crystal
        run: |
          python3 - <<'PY'
          import re
          p = "dist/github-snake.svg"
          s = open(p, encoding="utf-8").read()
          defs = ('<defs><linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1">'
                  '<stop offset="0" stop-color="#FFFFFF"/>'
                  '<stop offset=".55" stop-color="#EAF6FF"/>'
                  '<stop offset="1" stop-color="#BFE3FF"/></linearGradient></defs>')
          s = s.replace("</desc>", "</desc>" + defs, 1)
          s = re.sub(r"--cb:[^;]+;", "--cb:#CFDCF0;", s, count=1)
          s = s.replace("</style>", ".s{fill:url(#crystal);stroke:#4FA8F0;stroke-width:1.4px}</style>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
